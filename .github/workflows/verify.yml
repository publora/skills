name: Verify skills

on:
  # No branch filter on pull_request: a stacked PR targets its parent branch,
  # not main, and those are exactly the changes that most need checking.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Frontmatter, prices, stale paths, link hosts
        run: python3 scripts/check_skills.py

  package:
    name: Codex package in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate and confirm nothing changed
        run: |
          python3 scripts/sync_codex_marketplace.py
          git diff --exit-code -- .codex-marketplace \
            || { echo "::error::.codex-marketplace is stale; run scripts/sync_codex_marketplace.py"; exit 1; }

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every documentation link resolves
        run: python3 scripts/check_links.py
