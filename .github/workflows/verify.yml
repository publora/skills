name: Verify skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Frontmatter, prices, stale paths, link hosts
        run: python3 scripts/check_skills.py

  package:
    name: Codex package in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and confirm nothing changed
        run: |
          python3 scripts/sync_codex_marketplace.py
          git diff --exit-code -- .codex-marketplace \
            || { echo "::error::.codex-marketplace is stale; run scripts/sync_codex_marketplace.py"; exit 1; }

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every documentation link resolves
        run: python3 scripts/check_links.py
