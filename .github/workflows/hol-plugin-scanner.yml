name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan skills for unsafe instructions
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA, not by tag: a tag can be
      # repointed at new code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@bb4f519048c0fd1cd9d7b42056072d6070b8ad7d # v1.2.651
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          # The score gate is the real gate. Severity is set to critical because
          # every "high" this scanner reports here is the same finding repeated:
          # a documented `curl` to api.publora.com "sends workspace data to a
          # remote endpoint". Calling that API is what these skills are for, so
          # failing on it would leave CI permanently red for a reason nobody can
          # fix, and a check that is always red stops being read. Findings are
          # still scored and still uploaded as SARIF for a human to review.
          fail_on_severity: critical
          format: sarif
          upload_sarif: true
